# One-click hosting on Render (https://render.com): New → Blueprint → pick this repo.
# Render will ask you for the values marked `sync: false` (see README → "Selling it").
services:
  - type: web
    name: stockens
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx tsx server/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Postgres connection string (e.g. a free Neon database). Required: Render's free
      # plan has no disk, so without it accounts and purchases vanish on every restart.
      - key: DATABASE_URL
        sync: false
      # Your email(s): full access without paying, and control of the BTC bot limits.
      - key: ADMIN_EMAILS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PRICE_CENTS
        value: "199"
      - key: SESSION_SECRET
        generateValue: true
      # Render's servers are in the US, where binance.com blocks connections; Binance.US
      # serves the same market-data API.
      - key: BINANCE_WS
        value: wss://stream.binance.us:9443/stream
      - key: BINANCE_REST
        value: https://api.binance.us
